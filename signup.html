<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up | DevPath</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #1e293b;
    padding: 2.5rem;
    border-radius: 12px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
  p.subtitle { margin: 0 0 1.5rem; color: #94a3b8; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: #cbd5e1; }
  input {
    width: 100%;
    padding: 0.65rem 0.75rem;
    margin-bottom: 1rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: #6366f1; }
  button {
    width: 100%;
    padding: 0.75rem;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 0.5rem;
  }
  button:hover { background: #4f46e5; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .message {
    margin-top: 1rem;
    font-size: 0.85rem;
    padding: 0.6rem;
    border-radius: 6px;
    display: none;
  }
  .message.error { display: block; background: #7f1d1d; color: #fecaca; }
  .message.success { display: block; background: #14532d; color: #bbf7d0; }
  .footer-link { margin-top: 1.25rem; font-size: 0.85rem; text-align: center; color: #94a3b8; }
  .footer-link a { color: #818cf8; text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Create your account</h1>
  <p class="subtitle">Track your roadmap progress on DevPath.</p>

  <form id="signup-form">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@example.com" />

    <label for="password">Password</label>
    <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />

    <button type="submit" id="submit-btn">Sign Up</button>
  </form>

  <div id="message" class="message"></div>

  <div class="footer-link">
    Already have an account? <a href="signin.html">Sign in</a>
  </div>
</div>

<script>
  // ---- Replace these with your actual Supabase project values ----
  const SUPABASE_URL = "https://cgeunysucdymiqvvagfw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnZXVueXN1Y2R5bWlxdnZhZ2Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjUzNTAsImV4cCI6MjEwMjAwMTM1MH0.IZ9YJ8Nega_c_gS9uWORaaY8oYWV36G82s9OxVbri0w";
  // -------------------------------------------------------------

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("signup-form");
  const messageBox = document.getElementById("message");
  const submitBtn = document.getElementById("submit-btn");

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password
    });

    if (error) {
      showMessage(error.message, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign Up";
      return;
    }

    showMessage("Account created! Check your email to confirm, then sign in.", "success");
    submitBtn.textContent = "Sign Up";
    setTimeout(() => { window.location.href = "signin.html"; }, 2000);
  });
</script>

</body>
</html>
